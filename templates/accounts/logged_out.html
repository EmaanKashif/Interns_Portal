{% extends 'base.html' %}

{% block content %}

<div style="
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
">

    <div style="
        max-width: 500px;
        width: 100%;
        text-align: center;
        padding: 45px 35px;
    ">

        <div style="
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #818cf8;
        ">
            <i class="fa-solid fa-check"></i>
        </div>

        <h1 style="
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 10px;
        ">
            You've been logged out
        </h1>

        <p style="
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 25px;
        ">
            Your session has ended securely.
            You may now leave this page.
        </p>

        <a href="{% url 'accounts:login' %}"
           class="btn">
            <i class="fa-solid fa-right-to-bracket"></i>
            Sign In Again
        </a>

    </div>

</div>

{% endblock %}
